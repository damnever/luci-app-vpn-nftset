<div class="vpn-card vpn-downloads">
    <div class="vpn-card-heading"><div><h3><%:Downloaded domains%></h3><p><%:Search every domain from your subscriptions, including domains covered by custom rules.%></p></div></div>
    <div class="vpn-list-toolbar"><input type="search" data-role="downloaded-search" placeholder="<%:Search downloaded domains%>" aria-label="<%:Search downloaded domains%>" />
        <select data-role="source-filter" aria-label="<%:Filter by source%>"><option value=""><%:All sources%></option></select>
        <span class="vpn-list-count" data-role="downloaded-results"></span></div>
    <div class="vpn-table-wrap"><table class="vpn-table"><thead><tr><th><%:Domain%></th><th><%:Source%></th><th><%:Custom coverage%></th></tr></thead><tbody data-role="downloaded-rows"></tbody></table></div>
    <div class="vpn-pagination"><span data-role="downloaded-page"></span><div><button type="button" class="btn" data-action="downloaded-prev" disabled><%:Previous%></button><button type="button" class="btn" data-action="downloaded-next" disabled><%:Next%></button></div></div>
</div>
